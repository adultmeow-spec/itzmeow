<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Player Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Chakra+Petch:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0305; --panel:#16070a; --line:#3a0d14; --red:#e11d2e; --hot:#ff3b4a; --deep:#7a0a14; --text:#f4e9ea; --mute:#a98a8e;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Chakra Petch",system-ui,sans-serif;line-height:1.6;overflow-x:hidden;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(600px circle at var(--mx,50%) var(--my,30%),rgba(225,29,46,.22),transparent 60%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px);}
main{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:0 20px 60px}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.clock{display:flex;justify-content:flex-end;padding-top:18px}
.clock div{display:flex;align-items:baseline;gap:14px;background:var(--panel);border:1px solid var(--line);border-right:3px solid var(--red);padding:6px 18px;clip-path:polygon(12px 0,100% 0,100% 100%,0 100%,0 12px)}
#time{font-family:Teko,sans-serif;font-size:2rem;line-height:1;color:var(--hot);text-shadow:0 0 14px rgba(255,59,74,.6);font-variant-numeric:tabular-nums}
#date{font-size:.85rem;color:var(--mute)}
@media (max-width:520px){#date{display:none}}

/* HERO */
.hero{min-height:88vh;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:60px 0 30px}
.status{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;border:1px solid var(--line);background:var(--panel);padding:6px 14px;font-size:.9rem;color:var(--mute);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--hot);box-shadow:0 0 10px var(--hot);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
h1{font-family:Teko,sans-serif;font-weight:700;font-size:clamp(4.2rem,17vw,11rem);line-height:.82;margin:8px 0 0;letter-spacing:.01em;color:var(--text);position:relative;text-shadow:0 0 40px rgba(225,29,46,.55)}
h1::before,h1::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;overflow:hidden}
h1::before{color:var(--red);transform:translate(3px,0);clip-path:inset(0 0 55% 0);opacity:.8;animation:glitch 5s infinite steps(1)}
h1::after{color:#ff8a93;transform:translate(-3px,0);clip-path:inset(60% 0 0 0);opacity:.5;animation:glitch 5s infinite steps(1) reverse}
@keyframes glitch{0%,90%,100%{transform:translate(0,0)}92%{transform:translate(6px,-2px)}94%{transform:translate(-5px,2px)}96%{transform:translate(4px,0)}}
.tag{font-size:1.15rem;color:var(--mute);max-width:46ch;margin:14px 0 0}
.tag b{color:var(--text);font-weight:600}
.cta{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}
.btn{font:600 1rem "Chakra Petch",sans-serif;color:#fff;background:var(--red);padding:12px 26px;text-decoration:none;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);transition:background .15s,transform .15s}
.btn:hover{background:var(--hot);transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--red)}
a:focus-visible,.btn:focus-visible{outline:2px solid var(--hot);outline-offset:3px}

/* SECTIONS */
section{padding:46px 0 10px}
h2{font-family:Teko,sans-serif;font-weight:500;font-size:2.6rem;line-height:1;margin:0 0 20px;display:flex;align-items:center;gap:16px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--red),transparent)}
.about{display:grid;grid-template-columns:1.4fr 1fr;gap:28px}
.about p{margin:0 0 14px;color:#d9c6c8;max-width:60ch}
.facts{list-style:none;margin:0;padding:18px 20px;background:var(--panel);border-left:3px solid var(--red)}
.facts li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.facts li:last-child{border:0}
.facts span{color:var(--mute)}

/* LINKS */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;gap:6px;padding:22px 20px;background:var(--panel);border:1px solid var(--line);text-decoration:none;color:var(--text);clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));transition:background .2s,border-color .2s,transform .2s}
.card:hover{background:#26090e;border-color:var(--red);transform:translateY(-4px)}
.card svg{width:34px;height:34px;fill:var(--hot);margin-bottom:6px}
.card strong{font-family:Teko,sans-serif;font-size:1.8rem;font-weight:500;line-height:1}
.card em{font-style:normal;color:var(--mute);font-size:.95rem}
.card::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--red);transition:width .3s}
.card:hover::after{width:100%}

footer{margin-top:60px;padding-top:20px;border-top:1px solid var(--line);color:var(--mute);font-size:.9rem;text-align:center}

@media (max-width:720px){.about{grid-template-columns:1fr}.hero{min-height:80vh}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
  <div class="clock"><div><span id="time">--:--:--</span><span id="date"></span></div></div>
  <header class="hero">
    <div class="status"><span class="dot"></span><span id="status"></span></div>
    <h1 id="name" data-t=""></h1>
    <p class="tag" id="tagline"></p>
    <div class="cta">
      <a class="btn" href="#links">Connect with me</a>
      <a class="btn ghost" href="#about">About me</a>
    </div>
  </header>

  <section id="about">
    <h2>About me</h2>
    <div class="about">
      <div id="bio"></div>
      <ul class="facts" id="facts"></ul>
    </div>
  </section>

  <section id="links">
    <h2>Find me here</h2>
    <div class="grid" id="grid"></div>
  </section>

  <footer id="foot"></footer>
</main>

const $ = id => document.getElementById(id);

$("name").dataset.t = ME.name;

$("bio").innerHTML = ME.bio.map(p => "<p>"+p+"</p>").join("");
$("facts").innerHTML = ME.facts.map(f => "<li><span>"+f[0]+"</span><b>"+f[1]+"</b></li>").join("");
$("grid").innerHTML = ME.links.map(l =>
  '<a class="card"'+(l.copy?' href="#" data-copy="'+l.copy+'"':' href="'+l.url+'" target="_blank" rel="noopener"')+'>'+
  '<svg viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[l.id]||"")+'</svg>'+
  '<strong>'+l.title+'</strong><em>'+l.desc+'</em></a>').join("");
$("foot").textContent = "© " + new Date().getFullYear() + " " + ME.name;
document.title = ME.name + " | Player Profile";

(function(){
  const c = $("bg"), x = c.getContext("2d");
  if (!x) return;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  let w, h; const P = [];
  function size(){ w = innerWidth; h = innerHeight; c.width = w*dpr; c.height = h*dpr; x.setTransform(dpr,0,0,dpr,0,0); }
  function mk(init){ return { x: Math.random()*w, y: init ? Math.random()*h : h+10, r: Math.random()*2.2+.6, v: Math.random()*.6+.25, d: (Math.random()-.5)*.4, a: Math.random()*.6+.25, p: Math.random()*6.28, k: Math.floor(Math.random()*4), z: Math.random()*14+10, rot: Math.random()*6.28 }; }
  size();
  const N = Math.min(22, Math.floor(w/50));
  for (let i = 0; i < N; i++) P.push(mk(true));
  addEventListener("resize", size);
  const still = matchMedia("(prefers-reduced-motion:reduce)").matches;
  function draw(){
    x.clearRect(0,0,w,h);
    const hz = h*.62; draw.t = (draw.t||0) + (still ? 0 : .008);
    x.save(); x.strokeStyle = "rgba(225,29,46,.4)"; x.lineWidth = 1;
    for (let i = -12; i <= 12; i++){ x.beginPath(); x.moveTo(w/2 + i*w*.04, hz); x.lineTo(w/2 + i*w*.25, h); x.stroke(); }
    for (let j = 0; j < 10; j++){ const f = ((j + draw.t) % 10)/10; const y = hz + (h-hz)*f*f; x.globalAlpha = .15 + f*.5; x.beginPath(); x.moveTo(0,y); x.lineTo(w,y); x.stroke(); }
    x.restore();
    for (const p of P){
      p.y -= p.v; p.p += .02; p.x += p.d + Math.sin(p.p)*.3;
      if (p.y < -10) Object.assign(p, mk(false));
      x.save(); x.translate(p.x,p.y); x.rotate(p.rot += .01); x.globalAlpha = p.a*.7;
      x.strokeStyle = "#ff3b4a"; x.lineWidth = 2; x.shadowColor = "#e11d2e"; x.shadowBlur = 12;
      const s = p.z; x.beginPath();
      if (p.k === 0){ x.moveTo(0,-s); x.lineTo(s*.87,s*.5); x.lineTo(-s*.87,s*.5); x.closePath(); }
      else if (p.k === 1){ x.arc(0,0,s*.8,0,6.28); }
      else if (p.k === 2){ x.moveTo(-s*.7,-s*.7); x.lineTo(s*.7,s*.7); x.moveTo(s*.7,-s*.7); x.lineTo(-s*.7,s*.7); }
      else { x.rect(-s*.7,-s*.7,s*1.4,s*1.4); }
      x.stroke(); x.restore();
    }
    if (!still) requestAnimationFrame(draw);
  }
  draw();
})();

function tick(){
  const d = new Date();
  $("time").textContent = d.toLocaleTimeString("en-US",{timeZone:"Asia/Dhaka",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true});
  $("date").textContent = d.toLocaleDateString("en-GB",{timeZone:"Asia/Dhaka",weekday:"short",day:"numeric",month:"short",year:"numeric"}) + " · BD";
}
tick(); setInterval(tick, 1000);

document.addEventListener("click", e => {
  const c = e.target.closest("[data-copy]"); if(!c) return; e.preventDefault();
  const t = c.dataset.copy, em = c.querySelector("em"), old = em.textContent;
  const done = () => { em.textContent = "Copied: " + t; setTimeout(() => em.textContent = old, 2000); };
  try { navigator.clipboard.writeText(t).then(done, done); } catch(_) { done(); }
});

addEventListener("pointermove", e => {
  document.body.style.setProperty("--mx", e.clientX + "px");
  document.body.style.setProperty("--my", e.clientY + "px");
});
</script>
